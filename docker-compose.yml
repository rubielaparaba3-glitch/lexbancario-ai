services:
  backend:
    build: .
    container_name: lexbancario_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rag_net

  scraper:
    build: .
    container_name: lexbancario_scraper
    command: uvicorn scraper_service:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rag_net

  frontend:
    build: .
    container_name: lexbancario_frontend
    command: streamlit run app_streamlit.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
      - scraper
    environment:
      - API_URL=http://backend:8000/api/consultar
      - SCRAPER_URL=http://scraper:8001/api/ingestar-web
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge
